<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="article.css">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <title>Article</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="article.js" defer></script>
</head>
<body>
    <header id="top-bar">
        <a href="feed.html" id="back-btn">← All articles</a>
        <a href="index.html" id="wordmark">metisnotes</a>
        <div id="top-right">
            <span id="top-user" style="display:none"></span>
        </div>
    </header>

    <main id="article-main">
        <div id="article-meta">
            <span id="meta-author"></span>
            <span class="meta-dot">·</span>
            <span id="meta-date"></span>
            <span class="meta-dot">·</span>
            <span id="meta-words"></span>
        </div>

        <h1 id="article-title"></h1>

        <div id="article-body"></div>

        <div id="article-actions">
            <button id="btn-like">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span id="like-count">0</span>
            </button>
            <span id="view-count"></span>
        </div>
    </main>
</body>
</html>
