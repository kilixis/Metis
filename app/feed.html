<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="feed.css">
    <title>Metis — Read</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="feed.js" defer></script>
</head>
<body>
    <header id="top-bar">
        <a href="index.html" id="wordmark">metisnotes</a>
        <nav id="top-nav">
            <a href="main.html" id="btn-write">Write</a>
            <a href="auth.html" id="btn-account-nav">Sign in</a>
            <span id="btn-user-name" style="display:none"></span>
        </nav>
    </header>

    <main id="feed-main">
        <div id="feed-header">
            <h1 id="feed-title">Published articles</h1>
            <div id="filter-bar">
                <div id="filter-sort">
                    <button class="sort-btn active" data-sort="newest">Newest</button>
                    <button class="sort-btn" data-sort="views">Most viewed</button>
                    <button class="sort-btn" data-sort="likes">Most liked</button>
                </div>
                <input type="text" id="filter-author" placeholder="Filter by author…">
            </div>
        </div>

        <div id="article-list-header">
            <span class="col-title">Title</span>
            <span class="col-date">Date</span>
            <span class="col-words">Words</span>
            <span class="col-author">Author</span>
        </div>

        <div id="article-list"></div>

        <div id="feed-empty" style="display:none">No articles published yet.</div>
        <div id="feed-loading"><span></span><span></span><span></span></div>
    </main>

    <footer id="feed-footer">
        <span>metisnotes — free to use, no ads.</span>
    </footer>
</body>
</html>
